---

name: 'Build DEB (Ubuntu)'

on:
  workflow_dispatch:
    inputs:
      ubuntuver:
        description: 'Ubuntu Version'
        required: true
        type: choice
        options:
          - latest
          - 24.04
          - 22.04
        default: latest
      version:
        description: 'Kernel Version'
        required: false
        type: string
        default: ''
      compiler:
        description: 'Compiler to use'
        required: false
        type: choice
        options:
          - ''
          - gcc
          - llvm
        default: ''
      cpusched:
        description: 'CPU Scheduler'
        required: false
        type: choice
        options:
          - ''
          - pds
          - bmq
          - bore
          - cfs
          - eevdf
        default: ''
      noccache:
        description: 'Disable CCACHE'
        required: false
        type: choice
        options:
          - ''
          - false
          - true
        default: ''
      freespace:
        description: 'Run F̳r̳e̳e̳ ̳D̳i̳s̳k̳ ̳S̳p̳a̳c̳e̳'
        required: true
        type: choice
        options:
         - true
         - false
        default: false
      swapspace:
        description: 'Add Swap ̳S̳p̳a̳c̳e̳'
        required: true
        type: choice
        options:
          - true
          - false
        default: false
      kernelcomp:
        description: 'Compression for Kernel Image'
        required: false
        type: choice
        options:
          - zstd
          - xz
          - lz4
          - lzma
          - lzo
          - bzip2
          - gzip
        default: zstd
      modulecomp:
        description: 'Compression for Modules'
        required: false
        type: choice
        options:
          - zstd
          - xz
          - gzip
        default: zstd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  _modprobeddb_db_path: ${{ github.workspace }}/modprobed.db
  _kernel_work_folder: "/tmp"
  _kernel_source_folder: "/tmp"
  _distro: "Ubuntu"

jobs:
  build_kernel:
    timeout-minutes: 360
    runs-on: ubuntu-${{ inputs.ubuntuver }}
    defaults:
      run:
        shell: bash

    steps:
      - if: ${{ inputs.freespace == 'true' }}
        name: 👉🏻🗑️ F̳r̳e̳e̳ ̳D̳i̳s̳k̳ ̳S̳p̳a̳c̳e̳ ⋆｡‧˚ʚ🗑️ɞ˚‧｡⋆
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: true
          large-packages: false
          tool-cache: true

      - name: (づ ᴗ _ᴗ)づ𝘾𝙝𝙚𝙘𝙠𝙤𝙪𝙩 𝙧𝙚𝙥𝙤𝙨𝙞𝙩𝙤𝙧𝙮 🎁
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ˖⌕ ۫ . gєт ναяιαвℓєѕ  . . ﹫
        id: config
        run: |
          export CFG="customization.cfg"

          if [ ! -f $CFG ]; then
            echo "Error: $CFG not found"
            exit 1
          fi

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.cpusched }}" ]; then
            MYSCHED="${{ inputs.cpusched }}"
            echo "Using cpusched from workflow input"
          else
            MYSCHED=$(grep "cpusched=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using cpusched from config file"
          fi
          echo "_cpusched=$MYSCHED" >> $GITHUB_ENV

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.noccache }}" ]; then
            MYCCACHE="${{ inputs.noccache }}"
            echo "Using noccache from workflow input"
          else
            MYCCACHE=$(grep "noccache=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using noccache from config file"
          fi
          echo "_noccache=$MYCCACHE" >> $GITHUB_ENV

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.compiler }}" ]; then
            MYCC="${{ inputs.compiler }}"
            echo "Using compiler from workflow input"
          else
            MYCC=$(grep "compiler=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using compiler from config file"
          fi
          echo "_compiler=$MYCC" >> $GITHUB_ENV

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.version }}" ]; then
            MYKVER="${{ inputs.version }}"
            echo "Using version from workflow input"
          else
            MYKVER=$(grep "version=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using version from config file"
          fi
          echo "_version=$MYKVER" >> $GITHUB_ENV

          #MYKVER=$(grep "version=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          #echo "_version=$MYKVER" >> $GITHUB_ENV

          #MYDISTRO=$(grep "distro=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          #echo "_distro=$MYDISTRO" >> $GITHUB_ENV

          # Generate kernel compression config fragment
          if [[ "${{ inputs.kernelcomp }}" == "zstd" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            # CONFIG_KERNEL_GZIP is not set
            # CONFIG_KERNEL_BZIP2 is not set
            # CONFIG_KERNEL_LZMA is not set
            # CONFIG_KERNEL_XZ is not set
            # CONFIG_KERNEL_LZO is not set
            # CONFIG_KERNEL_LZ4 is not set
            CONFIG_KERNEL_ZSTD=y
            EOF
          elif [[ "${{ inputs.kernelcomp }}" == "xz" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            # CONFIG_KERNEL_GZIP is not set
            # CONFIG_KERNEL_BZIP2 is not set
            # CONFIG_KERNEL_LZMA is not set
            CONFIG_KERNEL_XZ=y
            # CONFIG_KERNEL_LZO is not set
            # CONFIG_KERNEL_LZ4 is not set
            # CONFIG_KERNEL_ZSTD is not set
            EOF
          elif [[ "${{ inputs.kernelcomp }}" == "lzma" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            # CONFIG_KERNEL_GZIP is not set
            # CONFIG_KERNEL_BZIP2 is not set
            CONFIG_KERNEL_LZMA=y
            # CONFIG_KERNEL_XZ is not set
            # CONFIG_KERNEL_LZO is not set
            # CONFIG_KERNEL_LZ4 is not set
            # CONFIG_KERNEL_ZSTD is not set
            EOF
          elif [[ "${{ inputs.kernelcomp }}" == "lz4" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            # CONFIG_KERNEL_GZIP is not set
            # CONFIG_KERNEL_BZIP2 is not set
            # CONFIG_KERNEL_LZMA is not set
            # CONFIG_KERNEL_XZ is not set
            # CONFIG_KERNEL_LZO is not set
            CONFIG_KERNEL_LZ4=y
            # CONFIG_KERNEL_ZSTD is not set
            EOF
          elif [[ "${{ inputs.kernelcomp }}" == "lzo" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            # CONFIG_KERNEL_GZIP is not set
            # CONFIG_KERNEL_BZIP2 is not set
            # CONFIG_KERNEL_LZMA is not set
            # CONFIG_KERNEL_XZ is not set
            CONFIG_KERNEL_LZO=y
            # CONFIG_KERNEL_LZ4 is not set
            # CONFIG_KERNEL_ZSTD is not set
            EOF
          elif [[ "${{ inputs.kernelcomp }}" == "bzip2" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            # CONFIG_KERNEL_GZIP is not set
            CONFIG_KERNEL_BZIP2=y
            # CONFIG_KERNEL_LZMA is not set
            # CONFIG_KERNEL_XZ is not set
            # CONFIG_KERNEL_LZO is not set
            # CONFIG_KERNEL_LZ4 is not set
            # CONFIG_KERNEL_ZSTD is not set
            EOF
          elif [[ "${{ inputs.kernelcomp }}" == "gzip" ]]; then
            cat >> kernelcomp.myfrag << 'EOF'
            CONFIG_KERNEL_GZIP=y
            # CONFIG_KERNEL_BZIP2 is not set
            # CONFIG_KERNEL_LZMA is not set
            # CONFIG_KERNEL_XZ is not set
            # CONFIG_KERNEL_LZO is not set
            # CONFIG_KERNEL_LZ4 is not set
            # CONFIG_KERNEL_ZSTD is not set
            EOF
          fi

          if [[ "${{ inputs.modulecomp }}" == "zstd" ]]; then
            cat >> modulecomp.myfrag << 'EOF'
            # CONFIG_MODULE_COMPRESS_GZIP is not set
            # CONFIG_MODULE_COMPRESS_XZ is not set
            CONFIG_MODULE_COMPRESS_ZSTD=y
            EOF
          elif [[ "${{ inputs.modulecomp }}" == "xz" ]]; then
            cat >> modulecomp.myfrag << 'EOF'
            # CONFIG_MODULE_COMPRESS_GZIP is not set
            CONFIG_MODULE_COMPRESS_XZ=y
            # CONFIG_MODULE_COMPRESS_ZSTD is not set
            EOF
          elif [[ "${{ inputs.modulecomp }}" == "gzip" ]]; then
            cat >> modulecomp.myfrag << 'EOF'
            CONFIG_MODULE_COMPRESS_GZIP=y
            # CONFIG_MODULE_COMPRESS_XZ is not set
            # CONFIG_MODULE_COMPRESS_ZSTD is not set
            EOF
          fi

          echo "_cpusched=$MYSCHED" >> $GITHUB_OUTPUT
          echo "_noccache=$MYCCACHE" >> $GITHUB_OUTPUT
          echo "_compiler=$MYCC" >> $GITHUB_OUTPUT
          echo "_version=$MYKVER" >> $GITHUB_OUTPUT

      - name: 📦 🇮‌🇳‌🇸‌🇹‌🇦‌🇱‌🇱‌ 🇧‌🇺‌🇮‌🇱‌🇩‌ 🇩‌🇪‌🇵‌🇪‌🇳‌🇩‌🇦‌🇳‌🇨‌🇮‌🇪‌🇸‌ 📦📦
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          execute_install_scripts: true
          packages: bc bison build-essential ccache cpio fakeroot flex git kmod libdw-dev
            libelf-dev libncurses-dev libssl-dev lz4 rsync schedtool wget zstd
            lld pkg-config devscripts make gcc debhelper llvm clang
          version: 1.1


      - if: ${{ inputs.swapspace == 'true' }}
        name: ⋆˚꩜｡ 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖 ⋆˚꩜｡
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - if: ${{ env._noccache != 'true' }}
        name: 🌍 🅲🅲🅰🅲🅷🅴 🅴🅽🆅🅸🆁🅾🅽🅼🅴🅽🆃 🆅🅰🆁🅸🅰🅱🅻🅴🆂 📜
        run: |
          cat >> $GITHUB_ENV << 'EOF'
          CCACHE_SLOPPINESS=file_macro,locale,time_macros
          CCACHE_NOHASHDIR=true
          CCACHE_COMPRESS=1
          CCACHE_COMPRESSLEVEL=9
          CCACHE_DEPEND=1
          EOF
          echo "CCACHE Environment set!"
          # Set Compiler
          if [[ "${{ env._compiler }}" == "llvm" ]]; then
            echo "CC=ccache clang" >> $GITHUB_ENV
            echo "CXX=ccache clang++" >> $GITHUB_ENV
          else
            echo "CC=ccache gcc" >> $GITHUB_ENV
            echo "CXX=ccache g++" >> $GITHUB_ENV
          fi
          echo "CCACHE Compilers set!"

          # Setup CCACHE Dir
          sudo mkdir -p /mnt/ccache
          sudo chown -R $USER:$USER /mnt/ccache
          echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
          echo "CCACHE Dir Set!"
          df -h

          echo "CCACHE Variables:"
          echo "CCACHE_SLOPPINESS=${{ env.CCACHE_SLOPPINESS }}"
          echo "CCACHE_NOHASHDIR=${{ env.CCACHE_NOHASHDIR }}"
          echo "CCACHE_COMPRESS=${{ env.CCACHE_COMPRESS }}"
          echo "CCACHE_COMPRESSLEVEL=${{ env.CCACHE_COMPRESSLEVEL }}"
          echo "CCACHE_DEPEND=${{ env.CCACHE_DEPEND }}"
          echo "CC=${{ env.CC }}"
          echo "CXX=${{ env.CC }}"
          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}"

      - if: ${{ env._noccache != 'true' }}
        name: ➰🐠 CCACHE 💨🐇
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: 'true'
          key: kernel-build-${{ runner.os }}-${{ hashFiles('Makefile', 'arch/*/Makefile',
            '.config') }}
          max-size: '10000MB'
          restore-keys: |
            kernel-build-${{ runner.os }}-
          verbose: 2

      - name: 🦼🧑‍🚧 ᑕOᗰᑭIᒪE KEᖇᑎEᒪ ᗩᑎᗪ ᗰOᗪᑌᒪEᔕ 👷🚧🏗️
        run: |
          echo "KBUILD_BUILD_TIMESTAMP=1970-01-01 00:00:00" >> $GITHUB_ENV
          echo "KBUILD_BUILD_VERSION=1" >> $GITHUB_ENV

          echo "Starting kernel build with:"
          echo "  Compiler: ${{ env._compiler }}"
          echo "  Scheduler: ${{ env._cpusched }}"
          echo "  Version: ${{ env._version }}"
          echo "  Kernel Compression: ${{ inputs.kernelcomp }}"
          echo "  Module Compression: ${{ inputs.modulecomp }}"

          set +o pipefail
          yes '' | ./install.sh install
          rc=${PIPESTATUS[1]}
          set -o pipefail

          if [ $rc -ne 0 ]; then
            echo "::error::Kernel build failed with exit code $rc"
            exit $rc
          fi

          echo "Build completed successfully"

      - name: 🧹🪣 P͎u͎r͎g͎e͎ ͎u͎s͎l͎e͎s͎s͎ ͎D͎E͎B͎ ͎f͎i͎l͎e͎s͎ ✨
        run: rm -rf DEBS/*dbg*.deb DEBS/*libc-dev*.deb 2>/dev/null || true

      - name: 𝓻𝓮𝓷𝓪𝓶𝓮 ᴋᴇʀɴᴇʟ ᴄᴏɴғɪɢ
        run: 'mv kernelconfig.new kernelconfig.${{ env._distro }}-${{ env._version }}.${{ env._cpusched }}.txt'

      - name: 🙈⛅️ Upload artifacts 💾😼
        uses: actions/upload-artifact@v4
        with:
          compression-level: 8
          retention-days: 30
          name: '${{ env._distro }}-kernel-${{ env._version }}-tkg-pkg-${{ env._cpusched }}_${{ env._compiler }}'
          path: |
            DEBS/*.deb
            kernelconfig*.txt
