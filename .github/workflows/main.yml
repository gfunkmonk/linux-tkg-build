---

name: 'Build DEB (Ubuntu)'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel Version (leave empty to use config file)'
        required: false
        type: string
        default: ''
      compiler:
        description: 'Compiler to use (leave empty to use config file)'
        required: false
        type: choice
        options:
          - ''
          - gcc
          - llvm
        default: ''
      cpusched:
        description: 'CPU Scheduler (leave empty to use config file)'
        required: false
        type: choice
        options:
          - ''
          - pds
          - bmq
          - bore
          - cfs
          - eevdf
          - upds
          - muqss
        default: ''
      noccache:
        description: 'No CCACHE (leave empty to use config file)'
        required: false
        type: choice
        options:
          - ''
          - false
          - true
        default: ''
      freespace:
        description: 'Run F̳r̳e̳e̳ ̳D̳i̳s̳k̳ ̳S̳p̳a̳c̳e̳'
        required: true
        type: choice
        options:
         - true
         - false
        default: true
      swapspace:
        description: 'Swap ̳S̳p̳a̳c̳e̳'
        required: true
        type: choice
        options:
         - 10GB
         - 9GB
         - 5GB
         - 4GB
         - None
        default: '10GB'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  _modprobeddb_db_path: ${{ github.workspace }}/modprobed.db
  _kernel_work_folder: "/tmp"
  _kernel_source_folder: "/tmp"
  _distro: "Ubuntu"

jobs:
  build_kernel:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - if: ${{ inputs.freespace == 'true' }}
        name: 👉🏻🗑️ F̳r̳e̳e̳ ̳D̳i̳s̳k̳ ̳S̳p̳a̳c̳e̳ ⋆｡‧˚ʚ🗑️ɞ˚‧｡⋆
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: true
          large-packages: false
          tool-cache: true

      - name: (づ ᴗ _ᴗ)づ𝘾𝙝𝙚𝙘𝙠𝙤𝙪𝙩 𝙧𝙚𝙥𝙤𝙨𝙞𝙩𝙤𝙧𝙮 🎁
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ˖⌕ ۫ . gєт ναяιαвℓєѕ  . . ﹫
        id: config
        run: |
          export CFG="customization.cfg"

          if [ ! -f $CFG ]; then
            echo "Error: $CFG not found"
            exit 1
          fi

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.cpusched }}" ]; then
            MYSCHED="${{ inputs.cpusched }}"
            echo "Using cpusched from workflow input"
          else
            MYSCHED=$(grep "cpusched=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using cpusched from config file"
          fi
          echo "_cpusched=$MYSCHED" >> $GITHUB_ENV

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.noccache }}" ]; then
            MYCCACHE="${{ inputs.noccache }}"
            echo "Using noccache from workflow input"
          else
            MYCCACHE=$(grep "noccache=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using noccache from config file"
          fi
          echo "_noccache=$MYCCACHE" >> $GITHUB_ENV

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.compiler }}" ]; then
            MYCC="${{ inputs.compiler }}"
            echo "Using compiler from workflow input"
          else
            MYCC=$(grep "compiler=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using compiler from config file"
          fi
          echo "_compiler=$MYCC" >> $GITHUB_ENV

          # Use input if provided, otherwise use config
          if [ -n "${{ inputs.version }}" ]; then
            MYKVER="${{ inputs.version }}"
            echo "Using version from workflow input"
          else
            MYKVER=$(grep "version=" $CFG | sed 's/"//g' | cut -d "=" -f2)
            echo "Using version from config file"
          fi
          echo "_version=$MYKVER" >> $GITHUB_ENV

          #MYKVER=$(grep "version=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          #echo "_version=$MYKVER" >> $GITHUB_ENV

          #MYDISTRO=$(grep "distro=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          #echo "_distro=$MYDISTRO" >> $GITHUB_ENV

          if [[ ${{ env._cpusched == 'muqss' }} ]]; then
            echo "_kernel_on_diet=false" >> $GITHUB_ENV
            echo "_modprobeddb=true" >> $GITHUB_ENV
          fi

          echo "_cpusched=$MYSCHED" >> $GITHUB_OUTPUT
          echo "_noccache=$MYCCACHE" >> $GITHUB_OUTPUT
          echo "_compiler=$MYCC" >> $GITHUB_OUTPUT
          echo "_version=$MYKVER" >> $GITHUB_OUTPUT

      - name: 📦 🇮‌🇳‌🇸‌🇹‌🇦‌🇱‌🇱‌ 🇧‌🇺‌🇮‌🇱‌🇩‌ 🇩‌🇪‌🇵‌🇪‌🇳‌🇩‌🇦‌🇳‌🇨‌🇮‌🇪‌🇸‌ 📦📦
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          execute_install_scripts: true
          packages: bc bison build-essential ccache cpio fakeroot flex git kmod libdw-dev
            libelf-dev libncurses-dev libssl-dev lz4 rsync schedtool wget zstd
            lld pkg-config devscripts make gcc debhelper llvm clang
          version: 1.1


      - if: ${{ inputs.swapspace == '4GB' }}
        name: ⋆˚꩜｡ 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖 ⋆˚꩜｡
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - if: ${{ inputs.swapspace == '5GB' }}
        name: ⋆˚꩜｡ 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖 ⋆˚꩜｡
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - if: ${{ inputs.swapspace == '9GB' }}
        name: ⋆˚꩜｡ 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖 ⋆˚꩜｡
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 9

      - if: ${{ inputs.swapspace == '10GB' }}
        name: ⋆˚꩜｡ 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖 ⋆˚꩜｡
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - if: ${{ env._noccache != 'true' }}
        name: 🌍 🅲🅲🅰🅲🅷🅴 🅴🅽🆅🅸🆁🅾🅽🅼🅴🅽🆃 🆅🅰🆁🅸🅰🅱🅻🅴🆂 📜
        run: |
          echo "CCACHE_SLOPPINESS=file_macro,locale,time_macros" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=9" >> $GITHUB_ENV
          echo "CCACHE_DEPEND=1" >> $GITHUB_ENV

      - if: ${{ env._noccache != 'true' }}
        name: ǁ⚒️👷 ƈƈǟƈɦɛ ƈօʍքɨʟɛʀ ʋǟʀɨǟɮʟɛֆ 👷⚒️ǁ
        run: |
          if [[ "${{ env._compiler }}" == "llvm" ]]; then
            echo "CC=ccache clang" >> $GITHUB_ENV
            echo "CXX=ccache clang++" >> $GITHUB_ENV
          else
            echo "CC=ccache gcc" >> $GITHUB_ENV
            echo "CXX=ccache g++" >> $GITHUB_ENV
          fi

      - if: ${{ env._noccache != 'true' }}
        name: 📂 𝐒𝖾𝗍 υρ 𝐂𝐂𝐀𝐂𝐇𝐄_𝐃𝚰𝐑
        run: |
          sudo mkdir -p /mnt/ccache
          sudo chown -R $USER:$USER /mnt/ccache
          #mkdir -p ${{ github.workspace }}/.ccache
          #sudo chown -R $USER:$USER ${{ github.workspace }}/.ccache
          #sudo mount --bind /mnt/ccache ${{ github.workspace }}/.ccache
          echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
          df -h

      - if: ${{ env._noccache != 'true' }}
        name: ➰🐠 CCACHE 💨🐇
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: 'true'
          key: kernel-build-${{ runner.os }}-${{ hashFiles('Makefile', 'arch/*/Makefile',
            '.config') }}
          max-size: '10000MB'
          restore-keys: |
            kernel-build-${{ runner.os }}-
          verbose: 2

      #- if: ${{ env._noccache != 'true' }}
      #  name: 🪳 Debug CCACHE + compiler 🤔 (before build)
      #  run: |
      #    echo "=== PRE-BUILD CCACHE STATUS ==="
      #    echo "CCACHE_DIR=$CCACHE_DIR"
      #    ccache -s || true
      #    echo "which gcc -> $(which gcc || true)"
      #    if [ -x "$(which gcc 2>/dev/null)" ]; then ls -l "$(which gcc)"; fi
      #    echo "PATH=$PATH"
      #    env | grep -i ccache || true
      #    echo "=== END PRE-BUILD STATUS ==="

      - if: ${{ env._cpusched == 'muqss' }}
        name: gcc stuff
        run: |
          apt update
          apt install gcc-12 g++-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV

      - name: 🦼🧑‍🚧 ᑕOᗰᑭIᒪE KEᖇᑎEᒪ ᗩᑎᗪ ᗰOᗪᑌᒪEᔕ 👷🚧🏗️
        run: |
          echo "KBUILD_BUILD_TIMESTAMP=1970-01-01 00:00:00" >> $GITHUB_ENV
          echo "KBUILD_BUILD_VERSION=1" >> $GITHUB_ENV
          #set +o pipefail
          #yes '' | ./install.sh install
          #rc=${PIPESTATUS[1]}
          #set -o pipefail
          #exit $rc

          echo "Starting kernel build with:"
          echo "  Compiler: ${{ env._compiler }}"
          echo "  Scheduler: ${{ env._cpusched }}"
          echo "  Version: ${{ env._version }}"

          set +o pipefail
          yes '' | ./install.sh install
          rc=${PIPESTATUS[1]}
          set -o pipefail

          if [ $rc -ne 0 ]; then
            echo "::error::Kernel build failed with exit code $rc"
            exit $rc
          fi

          echo "Build completed successfully"

     # - if: ${{ env._noccache != 'true' }}
     #   name: 🪲 Debug CCACHE 🧐 (after build)
     #   run: |
     #     echo "=== POST-BUILD CCACHE STATUS ==="
     #     ccache -s || true
     #     du -sh /mnt/ccache || true
     #     ls -la /mnt/ccache || true
     #     echo "=== END POST-BUILD STATUS ==="

      - name: 🧹🪣 P͎u͎r͎g͎e͎ ͎u͎s͎l͎e͎s͎s͎ ͎D͎E͎B͎ ͎f͎i͎l͎e͎s͎ ✨
        run: rm -rf DEBS/*dbg*.deb DEBS/*libc-dev*.deb 2>/dev/null || true

      - name: 𝓻𝓮𝓷𝓪𝓶𝓮 ᴋᴇʀɴᴇʟ ᴄᴏɴғɪɢ
        run: 'mv kernelconfig.new kernelconfig.${{ env._distro }}-${{ env._version }}.${{ env._cpusched }}.txt'

      - name: 🙈⛅️ Upload artifacts 💾😼
        uses: actions/upload-artifact@v4
        with:
          compression-level: 8
          retention-days: 30
          name: '${{ env._distro }}-kernel-${{ env._version }}-tkg-pkg-${{ env._cpusched }}_${{ env._compiler }}'
          path: |
            DEBS/*.deb
            kernelconfig*.txt
