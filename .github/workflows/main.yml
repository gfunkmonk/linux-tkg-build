          sudo mv *.sources /etc/apt/sources.list.d/
          sudo apt update -yq
          sudo apt install bc bison build-essential ccache clang cpio curl debhelper debhelper-compat devscripts dpkg-dev dwarves elfutils fakeroot flex g++ g++-14 g++-15 gawk gcc gcc-14 gcc-15 git kmod libdw-dev libelf-dev libncurses-dev libssl-dev libudev-dev lld llvm lz4 make patch pkg-config rsync schedtool sed wget xz-utils zlib1g-dev zstd -yq
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 13 --slave /usr/bin/g++ g++ /usr/bin/g++-13 --slave /usr/bin/gcc-ar gcc-ar /usr/bin/gcc-ar-13 --slave /usr/bin/gcc-ranlib gcc-ranlib /usr/bin/gcc-ranlib-13 --slave /usr/bin/gcc-nm gcc-nm /usr/bin/gcc-nm-13 --slave /usr/bin/gcov gov /usr/bin/gcov-13 --slave /usr/bin/gcov-dump gov-dump /usr/bin/gcov-dump-13 --slave /usr/bin/gcov-tool gov-tool /usr/bin/gcov-tool-13 --slave /usr/bin/lto-dump lto-dump /usr/bin/lto-dump-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14 --slave /usr/bin/g++ g++ /usr/bin/g++-14 --slave /usr/bin/gcc-ar gcc-ar /usr/bin/gcc-ar-14 --slave /usr/bin/gcc-ranlib gcc-ranlib /usr/bin/gcc-ranlib-14 --slave /usr/bin/gcc-nm gcc-nm /usr/bin/gcc-nm-14 --slave /usr/bin/gcov gov /usr/bin/gcov-14 --slave /usr/bin/gcov-dump gov-dump /usr/bin/gcov-dump-14 --slave /usr/bin/gcov-tool gov-tool /usr/bin/gcov-tool-14 --slave /usr/bin/lto-dump lto-dump /usr/bin/lto-dump-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 15 --slave /usr/bin/g++ g++ /usr/bin/g++-15 --slave /usr/bin/gcc-ar gcc-ar /usr/bin/gcc-ar-15 --slave /usr/bin/gcc-ranlib gcc-ranlib /usr/bin/gcc-ranlib-15 --slave /usr/bin/gcc-nm gcc-nm /usr/bin/gcc-nm-15 --slave /usr/bin/gcov gov /usr/bin/gcov-15 --slave /usr/bin/gcov-dump gov-dump /usr/bin/gcov-dump-15 --slave /usr/bin/gcov-tool gov-tool /usr/bin/gcov-tool-15 --slave /usr/bin/lto-dump lto-dump /usr/bin/lto-dump-15

      - name: 🔐 🄢🄢🄗 ⒱⒤⒜ 🄒⒧⒪⒰⒟⒡⒧⒜⒭⒠
        uses: valeriangalliat/action-sshd-cloudflared@v1

      - name: ˖⌕ ۫ . gєт ναяιαвℓєѕ  . . ﹫
        id: config
        run: |
          export CFG="customization.cfg"

          if [ ! -f $CFG ]; then
            echo "Error: $CFG not found"
            exit 1
          fi

          MYSCHED=$(grep "cpusched=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          echo "_cpusched=$MYSCHED" >> $GITHUB_ENV

          MYCCACHE=$(grep "noccache=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          echo "_noccache=$MYCCACHE" >> $GITHUB_ENV

          MYCC=$(grep "compiler=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          echo "_compiler=$MYCC" >> $GITHUB_ENV

          MYKVER=$(grep "version=" $CFG | sed 's/"//g' | cut -d "=" -f2)
          echo "_version=$MYKVER" >> $GITHUB_ENV

          echo "_cpusched=$MYSCHED" >> $GITHUB_OUTPUT
          echo "_noccache=$MYCCACHE" >> $GITHUB_OUTPUT
          echo "_compiler=$MYCC" >> $GITHUB_OUTPUT
          echo "_version=$MYKVER" >> $GITHUB_OUTPUT

      - if: ${{ inputs.swapspace }}
        name: ⋆˚꩜｡ 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖 ⋆˚꩜｡
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - if: ${{ env._noccache != 'true' }}
        name: 🌍 🅲🅲🅰🅲🅷🅴 🅴🅽🆅🅸🆁🅾🅽🅼🅴🅽🆃 🆅🅰🆁🅸🅰🅱🅻🅴🆂 📜
        run: |
          cat >> $GITHUB_ENV << 'EOF'
          CCACHE_SLOPPINESS=file_macro,locale,time_macros
          CCACHE_NOHASHDIR=true
          CCACHE_COMPRESS=1
          CCACHE_COMPRESSLEVEL=9
          CCACHE_DEPEND=1
          CCACHE_FILE_CLONE=true
          CCACHE_NOHARDLINK=true
          CCACHE_INODECACHE=true
          CCACHE_NORECACHE=true
          CCACHE_NLEVELS=4
          CCACHE_COMPILERCHECK=content
          EOF
          echo "CCACHE Environment set!"

          # Set Compiler
          if [[ "${{ env._compiler }}" == "llvm" ]]; then
            echo "CC=ccache clang" >> $GITHUB_ENV
            echo "CXX=ccache clang++" >> $GITHUB_ENV
          else
            echo "CC=ccache gcc" >> $GITHUB_ENV
            echo "CXX=ccache g++" >> $GITHUB_ENV
          fi
          echo "CCACHE Compilers set!"

          # Setup CCACHE Dir
          sudo mkdir -p /mnt/ccache
          sudo chown -R $USER:$USER /mnt/ccache
          echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
          echo "CCACHE Dir Set!"
          df -h

      - if: ${{ env._noccache != 'true' }}
        name: ➰🐠 CCACHE 💨🐇
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: 'true'
          key: kernel-build-${{ runner.os }}-${{ hashFiles('Makefile', 'arch/*/Makefile',
            '.config') }}
          max-size: '10000MB'
          restore-keys: |
            kernel-build-${{ runner.os }}-
          verbose: 2
          save: true

      - name: 🦼🧑‍🚧 ᑕOᗰᑭIᒪE KEᖇᑎEᒪ ᗩᑎᗪ ᗰOᗪᑌᒪEᔕ 👷🚧🏗️
        run: |
          echo "KBUILD_BUILD_TIMESTAMP=1970-01-01 00:00:00" >> $GITHUB_ENV
          echo "KBUILD_BUILD_VERSION=1" >> $GITHUB_ENV

          echo "Starting kernel build with:"
          echo "  Compiler: ${{ env._compiler }}"
          echo "  Scheduler: ${{ env._cpusched }}"
          echo "  Version: ${{ env._version }}"

          set +o pipefail
          yes '' | ./install.sh install
          rc=${PIPESTATUS[1]}
          set -o pipefail

          if [ $rc -ne 0 ]; then
            echo "::error::Kernel build failed with exit code $rc"
            exit $rc
          fi

          echo "Build completed successfully"

     #- name: 🔐 🄢🄢🄗 ⒱⒤⒜ 🄒⒧⒪⒰⒟⒡⒧⒜⒭⒠
     #  uses: valeriangalliat/action-sshd-cloudflared@v1

      - name: 🧹🪣 P͎u͎r͎g͎e͎ ͎u͎s͎l͎e͎s͎s͎ ͎D͎E͎B͎ ͎f͎i͎l͎e͎s͎ ✨
        run: rm -rf DEBS/*dbg*.deb DEBS/*libc-dev*.deb 2>/dev/null || true

      - name: 𝓻𝓮𝓷𝓪𝓶𝓮 ᴋᴇʀɴᴇʟ ᴄᴏɴғɪɢ
        run: 'mv kernelconfig.new kernelconfig.${{ env._distro }}-${{ env._version }}.${{ env._cpusched }}.txt'

      - name: 🙈⛅️ Upload artifacts 💾😼
        uses: actions/upload-artifact@v4
        with:
          compression-level: 8
          retention-days: 30
          if-no-files-found: error
          name: '${{ env._distro }}-kernel-${{ env._version }}-tkg-pkg-${{ env._cpusched }}_${{ env._compiler }}'
          path: |
            DEBS/*.deb
            kernelconfig*.txt
