---

name: 'Build DEB (Ubuntu)'

on:
  workflow_dispatch:
    inputs:
      freespace:
        description: 'Run F̳r̳e̳e̳ ̳D̳i̳s̳k̳ ̳S̳p̳a̳c̳e̳'
        required: true
        type: boolean
        default: false
      swapspace:
        description: 'Add Swap ̳S̳p̳a̳c̳e̳'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  _modprobeddb_db_path: ${{ github.workspace }}/modprobed.db
  _kernel_work_folder: "/tmp"
  _kernel_source_folder: "/tmp"
  _distro: "Ubuntu"

jobs:
  build_kernel:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - if: ${{ inputs.freespace }}
        name: 👉🏻🗑️ F̳r̳e̳e̳ ̳D̳i̳s̳k̳ ̳S̳p̳a̳c̳e̳ ⋆｡‧˚ʚ🗑️ɞ˚‧｡⋆
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: true
          large-packages: true
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true

      - name: (づ ᴗ _ᴗ)づ𝘾𝙝𝙚𝙘𝙠𝙤𝙪𝙩 𝙧𝙚𝙥𝙤𝙨𝙞𝙩𝙤𝙧𝙮 🎁
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 🇮‌🇳‌🇸‌🇹‌🇦‌🇱‌🇱‌ 🇧‌🇺‌🇮‌🇱‌🇩‌ 🇩‌🇪‌🇵‌🇪‌🇳‌🇩‌🇦‌🇳‌🇨‌🇮‌🇪‌🇸‌ 📦📦
        #uses: awalsh128/cache-apt-pkgs-action@latest
        #with:
        #  execute_install_scripts: true
        #  packages: bc bison build-essential ccache cpio fakeroot flex git kmod libdw-dev
        #    libelf-dev libncurses-dev libssl-dev lz4 rsync schedtool wget zstd
        #    lld pkg-config devscripts make gcc debhelper llvm clang sed
        #  version: 1.1
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa -y -n

          cat >> ubuntu_plucky.sources << 'EOF'
          Types: deb
          URIs: mirror+file:/etc/apt/apt-mirrors.txt
          Suites: plucky plucky-updates plucky-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: mirror+file:/etc/apt/apt-mirrors.txt
          Suites: plucky-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          cat >> ubuntu-toolchain-r-ubuntu-ppa-plucky.sources << 'EOF'
          Types: deb
          URIs: https://ppa.launchpadcontent.net/ubuntu-toolchain-r/ppa/ubuntu/
          Suites: plucky
          Components: main
          Signed-By:
           -----BEGIN PGP PUBLIC KEY BLOCK-----
            .
           mQINBGYzeoEBEADEVzm0fPTo1KfunTjKV5ZP0Mb86Z6izCXSYbeYt/iAaIfK7a8x
